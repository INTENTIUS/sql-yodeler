# Rendered from .github/src/ci.ts by `npm run workflows`. Edit that file, not this one.

name: ci

on:
  pull_request: null
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx yodel --version
      - run: npm run check
