# Rendered from .github/src/ci.ts by `npm run workflows`. Edit that file, not this one.

name: ci

on:
  pull_request: null
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx yodel --version
      - run: npm run check
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: npm ci
        working-directory: docs-site
        run: npm ci
      - name: Build the site
        working-directory: docs-site
        run: npm run build
