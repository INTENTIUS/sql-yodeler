# Rendered from .github/src/claims-weekly.ts by `npm run workflows`. Edit that file, not this one.
#
# Every claim, run by hand, against @intentius/sql-yodeler as npm serves it
# (`npm i @intentius/sql-yodeler@latest`), not against this checkout: the
# claims link that install's node_modules (YODEL_CLAIMS_NODE_MODULES,
# scenarios/lib/project.ts). The run rewrites the committed record,
# scenarios/claims-record.json, and the status page made from it (npm run
# claims:page, docs/claims.md), and when either changed, opens a pull
# request from branch claims-weekly, or updates the one already open.
# The template claims are skipped here, as in claims.yml. It runs only when
# a person starts it (between development cycles), never on a schedule.

name: claims-weekly

on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
    env:
      YODEL_CLAIMS_CLICKHOUSE_URL: http://localhost:8123
      YODEL_CLAIMS_POSTGRES_URL: postgres://localhost:5432/postgres
      YODEL_CLAIMS_LOG_DIR: '${{ github.workspace }}/claims-logs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve the emulator's images from a local mirror
        run: |
          echo '{ "registry-mirrors": ["http://localhost:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run -d --restart always --name hub-mirror -p 5000:5000 mirror.gcr.io/library/registry:2
          command -v skopeo || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          for ref in $(npx tsx scenarios/images.ts); do
            repo="${ref%%:*}"; rest="${ref#*:}"; tag="${rest%%@*}"; digest="${ref#*@}"
            case "$repo" in */*) path="$repo" ;; *) path="library/$repo" ;; esac
            for _ in 1 2 3; do
              skopeo copy -q --all --preserve-digests --dest-tls-verify=false "docker://mirror.gcr.io/$path@$digest" "docker://localhost:5000/$path:$tag" && break
              sleep 20
            done
            docker pull -q "$ref"
          done
      - name: Start the emulator
        working-directory: scenarios/fixtures/clickhouse
        run: |
          for i in 1 2 3; do
            timeout 600 npx chant emulator up --lexicon sql && exit 0
            sleep $((i * 30))
          done
          exit 1
      - name: Wait for ClickHouse and Postgres
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8123/ping >/dev/null && docker exec chant-postgres pg_isready -U postgres >/dev/null && exit 0
            sleep 2
          done
          docker ps -a
          exit 1
      - name: npm install @intentius/sql-yodeler@latest
        id: published
        run: |
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @intentius/sql-yodeler@latest
          version=$(node -p 'require("./node_modules/@intentius/sql-yodeler/package.json").version')
          echo "@intentius/sql-yodeler@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "YODEL_CLAIMS_NODE_MODULES=$dir/node_modules" >> "$GITHUB_ENV"
      - name: Claims
        id: claims
        continue-on-error: true
        run: timeout 3000 npm run claims -- --record scenarios/claims-record.json --skip template,template-github,template-gitlab
      - name: The status page
        run: npm run claims:page
      - name: A pull request when the record changed
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ steps.published.outputs.version }}'
        run: |
          if [ -z "$(git status --porcelain -- scenarios/claims-record.json docs/claims.md)" ]; then
            echo "the record and the page are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C claims-weekly
          git add -- scenarios/claims-record.json docs/claims.md
          title="chore: weekly claims record for @intentius/sql-yodeler@$VERSION"
          git commit -q -m "$title"
          git push -f origin claims-weekly
          if [ -z "$(gh pr list --head claims-weekly --state open --json number --jq '.[].number')" ]; then
            gh pr create --head claims-weekly --title "$title" --body "Every claim but the template claims, run by hand with claims-weekly.yml against @intentius/sql-yodeler@$VERSION from npm: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claims-weekly
          path: |
            scenarios/claims-record.json
            claims-logs/
      - name: Fail when a claim failed
        if: steps.claims.outcome == 'failure'
        run: exit 1
