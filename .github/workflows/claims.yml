# Rendered from .github/src/claims.ts by `npm run workflows`. Edit that file, not this one.
#
# The scenario claims (scenarios/run.ts): every claim against the sql
# emulator, plain and under BREAK=1. The forge claim needs a Forgejo with
# a runner, which this job has not, so it is skipped here. The record and every run's log are kept as the run's artifacts.
# It runs only when a person starts it (between development cycles), never
# on a pull request or a push: nothing merges or releases on the claims.

name: claims

on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YODEL_CLAIMS_CLICKHOUSE_URL: http://localhost:8123
      YODEL_CLAIMS_POSTGRES_URL: postgres://localhost:5432/postgres
      YODEL_CLAIMS_LOG_DIR: '${{ github.workspace }}/claims-logs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve the emulator's images from a local mirror
        run: |
          echo '{ "registry-mirrors": ["http://localhost:5000"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run -d --restart always --name hub-mirror -p 5000:5000 mirror.gcr.io/library/registry:2
          command -v skopeo || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          for ref in $(npx tsx scenarios/images.ts); do
            repo="${ref%%:*}"; rest="${ref#*:}"; tag="${rest%%@*}"; digest="${ref#*@}"
            case "$repo" in */*) path="$repo" ;; *) path="library/$repo" ;; esac
            for _ in 1 2 3; do
              skopeo copy -q --all --preserve-digests --dest-tls-verify=false "docker://mirror.gcr.io/$path@$digest" "docker://localhost:5000/$path:$tag" && break
              sleep 20
            done
            docker pull -q "$ref"
          done
      - name: Start the emulator
        working-directory: scenarios/fixtures/clickhouse
        run: |
          for i in 1 2 3; do
            timeout 600 npx chant emulator up --lexicon sql && exit 0
            sleep $((i * 30))
          done
          exit 1
      - name: Wait for ClickHouse and Postgres
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8123/ping >/dev/null && docker exec chant-postgres pg_isready -U postgres >/dev/null && exit 0
            sleep 2
          done
          docker ps -a
          exit 1
      - name: Claims
        run: timeout 3000 npm run claims -- --record claims-record.json --skip forge
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claims
          path: |
            claims-record.json
            claims-logs/
