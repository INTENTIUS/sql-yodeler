# Rendered by scripts/ci.ts (npm run ci) from chant.config.ts and ops/.
# Edit those and render again; npm run ci:check says when this file is stale.
name: watch-dev

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: watch-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch-dev:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    env:
      DEV_POSTGRES_URL: '${{ secrets.DEV_POSTGRES_URL }}'
      DEV_POSTGRES_READER_USER: '${{ secrets.DEV_POSTGRES_READER_USER }}'
      DEV_POSTGRES_READER_PASSWORD: '${{ secrets.DEV_POSTGRES_READER_PASSWORD }}'
      SQL_YODELER_TOKEN: '${{ secrets.SQL_YODELER_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - run: if [ -n "$SQL_YODELER_TOKEN" ]; then for from in ssh://git@github.com/INTENTIUS/sql-yodeler git@github.com:INTENTIUS/sql-yodeler https://github.com/INTENTIUS/sql-yodeler; do git config --global --add url."https://x-access-token:$SQL_YODELER_TOKEN@github.com/INTENTIUS/sql-yodeler".insteadOf "$from"; done; else echo 'SQL_YODELER_TOKEN is not set, so npm fetches @intentius/sql-yodeler with no token'; fi
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - run: git remote set-url --push origin no-push://the-drift-watch-only-reads
      - run: chant run watch-dev
        env:
          GITHUB_TOKEN: '${{ github.token }}'
      - run: tsx scripts/watch-outcome.ts watch-dev
