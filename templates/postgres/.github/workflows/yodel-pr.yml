# Rendered by scripts/ci.ts (npm run ci) from chant.config.ts and ops/.
# Edit those and render again; npm run ci:check says when this file is stale.
#
# Pull requests: yodel lint and the replay check (into a throwaway server the
# lint job starts), and the plan comment per environment with the
# environment's reader credentials. No job here holds a writer.
name: yodel-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: yodel-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      replay-postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: replay
        ports:
          - '5432:5432'
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 45
    env:
      REPLAY_POSTGRES_URL: postgres://localhost:5432/postgres
      REPLAY_POSTGRES_USER: postgres
      REPLAY_POSTGRES_PASSWORD: replay
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Read access to sql-yodeler (SQL_YODELER_TOKEN)
        run: if [ -n "$SQL_YODELER_TOKEN" ]; then for from in ssh://git@github.com/INTENTIUS/sql-yodeler git@github.com:INTENTIUS/sql-yodeler https://github.com/INTENTIUS/sql-yodeler; do git config --global --add url."https://x-access-token:$SQL_YODELER_TOKEN@github.com/INTENTIUS/sql-yodeler".insteadOf "$from"; done; else echo 'SQL_YODELER_TOKEN is not set, so npm fetches @intentius/sql-yodeler with no token'; fi
        env:
          SQL_YODELER_TOKEN: '${{ secrets.SQL_YODELER_TOKEN }}'
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: The pipelines are up to date
        run: npm run ci:check
      - name: yodel lint
        run: yodel lint
      - name: Wait for the replay server (replay-postgres)
        run: node -e 'const net = require("net"); let n = 0; (function t() { const s = net.connect(5432, "localhost", () => { s.end(); process.exit(0); }); s.on("error", () => { if (++n > 90) { console.error("localhost:5432 did not answer"); process.exit(1); } setTimeout(t, 1000); }); })()'
      - name: yodel lint --replay
        run: yodel lint --replay replay --reset
  plan-dev:
    runs-on: ubuntu-latest
    env:
      DEV_POSTGRES_URL: '${{ secrets.DEV_POSTGRES_URL }}'
      DEV_POSTGRES_READER_USER: '${{ secrets.DEV_POSTGRES_READER_USER }}'
      DEV_POSTGRES_READER_PASSWORD: '${{ secrets.DEV_POSTGRES_READER_PASSWORD }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Read access to sql-yodeler (SQL_YODELER_TOKEN)
        run: if [ -n "$SQL_YODELER_TOKEN" ]; then for from in ssh://git@github.com/INTENTIUS/sql-yodeler git@github.com:INTENTIUS/sql-yodeler https://github.com/INTENTIUS/sql-yodeler; do git config --global --add url."https://x-access-token:$SQL_YODELER_TOKEN@github.com/INTENTIUS/sql-yodeler".insteadOf "$from"; done; else echo 'SQL_YODELER_TOKEN is not set, so npm fetches @intentius/sql-yodeler with no token'; fi
        env:
          SQL_YODELER_TOKEN: '${{ secrets.SQL_YODELER_TOKEN }}'
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: yodel plan dev --comment
        run: yodel plan dev --comment
        env:
          GITHUB_TOKEN: '${{ github.token }}'
  plan-prod:
    runs-on: ubuntu-latest
    env:
      PROD_POSTGRES_URL: '${{ secrets.PROD_POSTGRES_URL }}'
      PROD_POSTGRES_READER_USER: '${{ secrets.PROD_POSTGRES_READER_USER }}'
      PROD_POSTGRES_READER_PASSWORD: '${{ secrets.PROD_POSTGRES_READER_PASSWORD }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Read access to sql-yodeler (SQL_YODELER_TOKEN)
        run: if [ -n "$SQL_YODELER_TOKEN" ]; then for from in ssh://git@github.com/INTENTIUS/sql-yodeler git@github.com:INTENTIUS/sql-yodeler https://github.com/INTENTIUS/sql-yodeler; do git config --global --add url."https://x-access-token:$SQL_YODELER_TOKEN@github.com/INTENTIUS/sql-yodeler".insteadOf "$from"; done; else echo 'SQL_YODELER_TOKEN is not set, so npm fetches @intentius/sql-yodeler with no token'; fi
        env:
          SQL_YODELER_TOKEN: '${{ secrets.SQL_YODELER_TOKEN }}'
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: yodel plan prod --comment
        run: yodel plan prod --comment
        env:
          GITHUB_TOKEN: '${{ github.token }}'
