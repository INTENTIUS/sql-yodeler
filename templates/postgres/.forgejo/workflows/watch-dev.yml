# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
name: watch-dev

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: watch-dev
  cancel-in-progress: false

jobs:
  watch-dev:
    runs-on: docker
    container: node:22-bookworm
    env:
      DEV_POSTGRES_URL: '${{ secrets.DEV_POSTGRES_URL }}'
      DEV_POSTGRES_READER_USER: '${{ secrets.DEV_POSTGRES_READER_USER }}'
      DEV_POSTGRES_READER_PASSWORD: '${{ secrets.DEV_POSTGRES_READER_PASSWORD }}'
      YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
      YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
      GITHUB_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: ./node_modules/.bin/yodel ci --fetch-ledger
      - run: git remote set-url --push origin no-push://the-drift-watch-only-reads
      - run: yodel chant run watch-dev
        env:
          GITHUB_TOKEN: '${{ github.token }}'
      - run: yodel drift dev --issue
