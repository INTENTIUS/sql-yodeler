# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
#
# Merge requests: chant's check job and each environment's plan on chant's
# product plan (stage plan), in .gitlab/yodel-plan.gitlab-ci.yml. A merge request's own
# pipeline holds no token for its notes: a pipeline schedule of the default
# branch with CHANT_PLAN_NOTES=1, which you create, posts every open merge
# request's notes and sets yodel/plan/<env> (stage plan-note).
# A push to the default branch: the apply waves, one stage each, in .gitlab/yodel-apply.gitlab-ci.yml.
# The drift watches are in .gitlab/yodel-watch.gitlab-ci.yml (stage ops).
# /yodel new, chant's commit job, is in .gitlab/yodel-commit.gitlab-ci.yml (stage ops).
# /yodel rebase, after the merge request's check, is in .gitlab/yodel-rebase.gitlab-ci.yml (stage ops).
#
# GitLab gives every job the project's CI/CD variables unless a variable is
# protected or scoped to an environment, so the split between reader and
# writer is in the variables' settings (Settings > CI/CD > Variables):
#   DEV_POSTGRES_URL, DEV_POSTGRES_READER_USER, DEV_POSTGRES_READER_PASSWORD: not protected (merge request
#     pipelines run on unprotected branches), masked; no environment scope.
#   DEV_POSTGRES_WRITER_USER, DEV_POSTGRES_WRITER_PASSWORD: protected, masked,
#     environment scope "dev": only dev's wave job declares that environment.
#   PROD_POSTGRES_URL, PROD_POSTGRES_READER_USER, PROD_POSTGRES_READER_PASSWORD: not protected (merge request
#     pipelines run on unprotected branches), masked; no environment scope.
#   PROD_POSTGRES_WRITER_USER, PROD_POSTGRES_WRITER_PASSWORD: protected, masked,
#     environment scope "prod": only prod's wave job declares that environment.
#   GITLAB_TOKEN: a project access token with the api scope (Reporter), for
#     the plan comment and the drift watch's tracking issue; CI_JOB_TOKEN
#     cannot write merge request notes or issues.
# The jobs that hold no writer read with the reader: chant.config.ts picks an
# environment's writer only under YODEL_CREDENTIALS=writer:<env>, which only
# that environment's wave job sets.

include:
  - local: .gitlab/yodel-plan.gitlab-ci.yml
  - local: .gitlab/yodel-apply.gitlab-ci.yml
  - local: .gitlab/yodel-watch.gitlab-ci.yml
  - local: .gitlab/yodel-commit.gitlab-ci.yml
  - local: .gitlab/yodel-rebase.gitlab-ci.yml

stages:
  - review
  - plan
  - plan-note
  - wave-1-dev
  - wave-2-prod
  - ops

variables:
  GIT_DEPTH: '0'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.yodel:
  image:
    name: node:22-bookworm
  before_script:
    - npm ci
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - ./node_modules/.bin/yodel ci --fetch-ledger
