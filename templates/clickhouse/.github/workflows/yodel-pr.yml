# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
#
# Pull requests: yodel lint and the replay check (into a throwaway server the
# lint job starts), and the plan comment per environment with the
# environment's reader credentials. No job here holds a writer, and each plan
# job shows it first: yodel config check --write-probe tries a write and
# fails the job when the server lets it through.

name: yodel-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: yodel-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    services:
      replay-clickhouse:
        image: clickhouse/clickhouse-server:26.8.15.10
        env:
          CLICKHOUSE_SKIP_USER_SETUP: '1'
        options: --health-cmd "clickhouse-client --query 'SELECT 1'" --health-interval 2s --health-timeout 5s --health-retries 45
    env:
      REPLAY_CLICKHOUSE_URL: http://replay-clickhouse:8123
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: The pipelines are up to date
        run: yodel ci --check
      - name: yodel lint
        run: yodel lint
      - name: Wait for the replay server (replay-clickhouse)
        run: node -e 'const net = require("net"); let n = 0; (function t() { const s = net.connect(8123, "replay-clickhouse", () => { s.end(); process.exit(0); }); s.on("error", () => { if (++n > 90) { console.error("replay-clickhouse:8123 did not answer"); process.exit(1); } setTimeout(t, 1000); }); })()'
      - name: yodel lint --replay
        run: yodel lint --replay replay --reset
  plan-dev:
    runs-on: ubuntu-latest
    env:
      DEV_CLICKHOUSE_URL: '${{ secrets.DEV_CLICKHOUSE_URL }}'
      DEV_CLICKHOUSE_READER_USER: '${{ secrets.DEV_CLICKHOUSE_READER_USER }}'
      DEV_CLICKHOUSE_READER_PASSWORD: '${{ secrets.DEV_CLICKHOUSE_READER_PASSWORD }}'
      YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
      YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: This job cannot write
        run: yodel config check dev --write-probe
      - name: yodel plan dev --comment
        run: yodel plan dev --comment
        env:
          GITHUB_TOKEN: '${{ github.token }}'
      - name: yodel report dev
        if: always()
        run: mkdir -p yodel-report; ./node_modules/.bin/yodel report dev --json > yodel-report/dev.json || true; ./node_modules/.bin/yodel report dev --html yodel-report/dev.html || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodel-report-plan-dev
          path: yodel-report
          if-no-files-found: ignore
  plan-prod:
    runs-on: ubuntu-latest
    env:
      PROD_CLICKHOUSE_URL: '${{ secrets.PROD_CLICKHOUSE_URL }}'
      PROD_CLICKHOUSE_READER_USER: '${{ secrets.PROD_CLICKHOUSE_READER_USER }}'
      PROD_CLICKHOUSE_READER_PASSWORD: '${{ secrets.PROD_CLICKHOUSE_READER_PASSWORD }}'
      DEV_CLICKHOUSE_URL: '${{ secrets.DEV_CLICKHOUSE_URL }}'
      DEV_CLICKHOUSE_READER_USER: '${{ secrets.DEV_CLICKHOUSE_READER_USER }}'
      DEV_CLICKHOUSE_READER_PASSWORD: '${{ secrets.DEV_CLICKHOUSE_READER_PASSWORD }}'
      YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
      YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Fetch the approvals (chant/lifecycle)
        run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: This job cannot write
        run: yodel config check prod dev --write-probe
      - name: yodel plan prod --comment
        run: yodel plan prod --comment
        env:
          GITHUB_TOKEN: '${{ github.token }}'
      - name: yodel report prod
        if: always()
        run: mkdir -p yodel-report; ./node_modules/.bin/yodel report prod --json > yodel-report/prod.json || true; ./node_modules/.bin/yodel report prod --html yodel-report/prod.html || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodel-report-plan-prod
          path: yodel-report
          if-no-files-found: ignore
