# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
name: watch-prod

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}

concurrency:
  group: watch-prod
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch-prod:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    env:
      PROD_CLICKHOUSE_URL: '${{ secrets.PROD_CLICKHOUSE_URL }}'
      PROD_CLICKHOUSE_READER_USER: '${{ secrets.PROD_CLICKHOUSE_READER_USER }}'
      PROD_CLICKHOUSE_READER_PASSWORD: '${{ secrets.PROD_CLICKHOUSE_READER_PASSWORD }}'
      YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
      YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
      GITHUB_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: ./node_modules/.bin/yodel ci --fetch-ledger
      - run: git remote set-url --push origin no-push://the-drift-watch-only-reads
      - run: yodel chant run watch-prod
        env:
          GITHUB_TOKEN: '${{ github.token }}'
      - run: yodel drift prod --issue
