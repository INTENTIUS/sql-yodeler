# Rendered by scripts/ci.ts (npm run ci) from chant.config.ts and ops/.
# Edit those and render again; npm run ci:check says when this file is stale.
#
# A push to main: one job per wave, each needing the one before. Each runs
# chant run wave: yodel apply <env> --wave-plan plans the environment, the
# wave's gate policy is read from yodel-waves.json as the commit before the push
# has it (yodel.config.ts waves, rendered), and a wave that needs an approval
# exits 3 with the chant approve command, so the waves after it do not run.
# Approve, push chant/lifecycle, and run the failed job again. These are the
# only jobs that hold a writer's credentials, one environment's each.
name: yodel-apply

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: yodel-apply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wave-1-dev:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    environment:
      name: dev
    env:
      YODEL_CREDENTIALS: writer
      YODEL_LOCK_WAIT: '10m'
      YODEL_STAND_DOWN: '1'
      DEV_CLICKHOUSE_URL: '${{ secrets.DEV_CLICKHOUSE_URL }}'
      DEV_CLICKHOUSE_WRITER_USER: '${{ secrets.DEV_CLICKHOUSE_WRITER_USER }}'
      DEV_CLICKHOUSE_WRITER_PASSWORD: '${{ secrets.DEV_CLICKHOUSE_WRITER_PASSWORD }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: Plan, gate and apply wave 1 (dev)
        run: chant run wave --spec yodel-waves.json --wave 1
  wave-2-prod:
    runs-on: ubuntu-latest
    needs:
      - wave-1-dev
    container: node:22-bookworm
    environment:
      name: prod
    env:
      YODEL_CREDENTIALS: writer
      YODEL_LOCK_WAIT: '10m'
      YODEL_STAND_DOWN: '1'
      PROD_CLICKHOUSE_URL: '${{ secrets.PROD_CLICKHOUSE_URL }}'
      PROD_CLICKHOUSE_WRITER_USER: '${{ secrets.PROD_CLICKHOUSE_WRITER_USER }}'
      PROD_CLICKHOUSE_WRITER_PASSWORD: '${{ secrets.PROD_CLICKHOUSE_WRITER_PASSWORD }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: Plan, gate and apply wave 2 (prod)
        run: chant run wave --spec yodel-waves.json --wave 2
