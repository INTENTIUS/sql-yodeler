 any credential is taken or code checked out");process.exit(9)}console.log(at+": "+(C.length?C.join(", "):"nothing to check")+(S.length?"; not checked: "+S.join(", "):""))}).catch((e)=>fail(e&&e.message?e.message:String(e)));'')'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the earlier jobs' outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: .chant/op-waves/yodel-apply/outcomes
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: git fetch --no-tags origin '+refs/heads/chant/lifecycle:refs/remotes/origin/chant/lifecycle' && git branch -f chant/lifecycle origin/chant/lifecycle || echo 'no chant/lifecycle branch yet, so nothing is approved'
      - name: Plan, gate and apply wave 2 (prod)
        run: yodel chant run wave --spec yodel-waves.json --wave 2
      - name: Keep the job's outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yodel-apply-wave-2-prod-outcome
          path: .chant/op-waves/yodel-apply/outcomes/outcome-wave-2.json
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
      - name: yodel report prod
        if: always()
        run: mkdir -p yodel-report; ./node_modules/.bin/yodel report prod --json > yodel-report/prod.json || true; ./node_modules/.bin/yodel report prod --html yodel-report/prod.html || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yodel-report-wave-2-prod
          path: yodel-report
          if-no-files-found: ignore
