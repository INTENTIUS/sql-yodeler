# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
#
# Pull requests: yodel lint and the replay check (into a throwaway server the
# lint job starts), and the plan per environment on chant's product plan: a
# plan job with the environment's reader credentials and no forge token,
# then a note job that posts the note and the status yodel/plan/<env>. No job
# here holds a writer, and each plan job shows it first: yodel config check
# --write-probe tries a write and fails the job when the server lets it through.

name: yodel-pr

on:
  pull_request:
    branches:
      - main

env:
  CHANT_ENV: yodel-pr

concurrency:
  group: yodel-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan-dev:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: node:22-bookworm
    outputs:
      report_0: '${{ steps.plan.outputs.report_0 }}'
      report_1: '${{ steps.plan.outputs.report_1 }}'
      report_2: '${{ steps.plan.outputs.report_2 }}'
      report_3: '${{ steps.plan.outputs.report_3 }}'
    steps:
      - name: Check out the change
        env:
          CHANT_CHECKOUT_TOKEN: '${{ github.token }}'
        run: |
          set -eu
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ -n "${CHANT_CHECKOUT_TOKEN:-}" ]; then
            chant_auth="$(printf 'x-access-token:%s' "$CHANT_CHECKOUT_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $chant_auth"
            unset chant_auth
          fi
          ref="$GITHUB_REF"
          want="$GITHUB_SHA"
          case "$ref" in
            refs/heads/*) target="refs/remotes/origin/${ref#refs/heads/}" ;;
            refs/tags/*) target="$ref" ;;
            refs/*) target="refs/remotes/${ref#refs/}" ;;
            *) target="refs/remotes/origin/chant-head" ;;
          esac
          if git rev-parse -q --verify HEAD >/dev/null; then git clean -ffdxq; fi
          git -c protocol.version=2 fetch -q --prune --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "+$want:$target"
          git -c protocol.version=2 fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
          case "$ref" in
            refs/heads/*) git checkout -q --force -B "${ref#refs/heads/}" "$target" ;;
            *) git checkout -q --force --detach "$target" ;;
          esac
      - run: |
          if [ -z "${CHANT_NO_FORGE_TOKEN:-}" ] && [ "${0#*/}" != "$0" ] && [ -f "$0" ] && ! { [ "${0##*/}" = sh ] || [ "${0##*/}" = bash ] || [ "${0##*/}" = dash ]; } && command -v env >/dev/null 2>&1 && command -v sh >/dev/null 2>&1; then exec env -u CHANT_FORGE_TOKEN -u CHANT_GITHUB_TOKEN -u CHANT_FORGEJO_TOKEN -u CHANT_GITLAB_TOKEN -u CHANT_CHECKOUT_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u GITLAB_TOKEN -u CI_JOB_TOKEN -u ACTIONS_RUNTIME_TOKEN CHANT_NO_FORGE_TOKEN=1 sh -e "$0"; fi; unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
          npm ci
      - run: |
          if [ -z "${CHANT_NO_FORGE_TOKEN:-}" ] && [ "${0#*/}" != "$0" ] && [ -f "$0" ] && ! { [ "${0##*/}" = sh ] || [ "${0##*/}" = bash ] || [ "${0##*/}" = dash ]; } && command -v env >/dev/null 2>&1 && command -v sh >/dev/null 2>&1; then exec env -u CHANT_FORGE_TOKEN -u CHANT_GITHUB_TOKEN -u CHANT_FORGEJO_TOKEN -u CHANT_GITLAB_TOKEN -u CHANT_CHECKOUT_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u GITLAB_TOKEN -u CI_JOB_TOKEN -u ACTIONS_RUNTIME_TOKEN CHANT_NO_FORGE_TOKEN=1 sh -e "$0"; fi; unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: This job cannot write
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          DEV_CLICKHOUSE_URL: '${{ secrets.DEV_CLICKHOUSE_URL }}'
          DEV_CLICKHOUSE_READER_USER: '${{ secrets.DEV_CLICKHOUSE_READER_USER }}'
          DEV_CLICKHOUSE_READER_PASSWORD: '${{ secrets.DEV_CLICKHOUSE_READER_PASSWORD }}'
          YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
          YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
        run: |
          if [ -z "${CHANT_NO_FORGE_TOKEN:-}" ] && [ "${0#*/}" != "$0" ] && [ -f "$0" ] && ! { [ "${0##*/}" = sh ] || [ "${0##*/}" = bash ] || [ "${0##*/}" = dash ]; } && command -v env >/dev/null 2>&1 && command -v sh >/dev/null 2>&1; then exec env -u CHANT_FORGE_TOKEN -u CHANT_GITHUB_TOKEN -u CHANT_FORGEJO_TOKEN -u CHANT_GITLAB_TOKEN -u CHANT_CHECKOUT_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u GITLAB_TOKEN -u CI_JOB_TOKEN -u ACTIONS_RUNTIME_TOKEN CHANT_NO_FORGE_TOKEN=1 sh -e "$0"; fi; unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
          yodel config check dev --write-probe
      - name: Plan dev
        id: plan
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          DEV_CLICKHOUSE_URL: '${{ secrets.DEV_CLICKHOUSE_URL }}'
          DEV_CLICKHOUSE_READER_USER: '${{ secrets.DEV_CLICKHOUSE_READER_USER }}'
          DEV_CLICKHOUSE_READER_PASSWORD: '${{ secrets.DEV_CLICKHOUSE_READER_PASSWORD }}'
          YODEL_WEBHOOK_URL: '${{ secrets.YODEL_WEBHOOK_URL }}'
          YODEL_WEBHOOK_KEY: '${{ secrets.YODEL_WEBHOOK_KEY }}'
        run: |
          if [ -z "${CHANT_NO_FORGE_TOKEN:-}" ] && [ "${0#*/}" != "$0" ] && [ -f "$0" ] && ! { [ "${0##*/}" = sh ] || [ "${0##*/}" = bash ] || [ "${0##*/}" = dash ]; } && command -v env >/dev/null 2>&1 && command -v sh >/dev/null 2>&1; then exec env -u CHANT_FORGE_TOKEN -u CHANT_GITHUB_TOKEN -u CHANT_FORGEJO_TOKEN -u CHANT_GITLAB_TOKEN -u CHANT_CHECKOUT_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u GITLAB_TOKEN -u CI_JOB_TOKEN -u ACTIONS_RUNTIME_TOKEN CHANT_NO_FORGE_TOKEN=1 sh -e "$0"; fi; unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
          chant_report="$PWD/.chant/pr"
          chant_handover() { node -e 'const fs=require("fs"),p=require("path"),z=require("zlib");const [dir,out]=process.argv.slice(1);const CHUNK=1000000,PARTS=4,NOTE=["pr-plan.json","pr-note.md"];const all={};const walk=(d,r)=>{let n=[];try{n=fs.readdirSync(d).sort()}catch{return}for(const x of n){const f=p.join(d,x),k=r?r+"/"+x:x;let s;try{s=fs.lstatSync(f)}catch{continue}if(s.isDirectory())walk(f,k);else if(s.isFile())all[k]=fs.readFileSync(f).toString("base64")}};walk(dir,"");const pack=(o)=>z.gzipSync(JSON.stringify(o)).toString("base64");let b=pack(all);if(b.length>CHUNK*PARTS){b=pack(Object.fromEntries(Object.entries(all).filter(([k])=>NOTE.includes(k))));if(b.length>CHUNK*PARTS){b=pack({});console.error("chant: the plan report is too large to hand to the note job, even cut to the report and the note; it hands on none of it")}else console.error("chant: the plan report is too large to hand to the note job whole; it hands on pr-plan.json and pr-note.md")}let o="";for(let i=0;i*CHUNK<b.length;i++)o+="report_"+i+"="+b.slice(i*CHUNK,(i+1)*CHUNK)+"\n";fs.appendFileSync(out,o);' "$chant_report" "${GITHUB_OUTPUT:-/dev/null}" || echo "chant: the plan report could not be handed to the note job" >&2; }
          trap chant_handover EXIT
          chant_plan_exit=0
          yodel plan dev --pr-note .chant/pr || chant_plan_exit=$?
          mkdir -p .chant/pr/report; yodel report dev --json > .chant/pr/report/dev.json || true; yodel report dev --html .chant/pr/report/dev.html || true || echo "chant: the report line exited $?" >&2
          [ "$chant_plan_exit" -eq 0 ] || exit "$chant_plan_exit"
  plan-note-dev:
    needs:
      - plan-dev
    if: always() && github.event_name == 'pull_request' && (needs.plan-dev.result == 'success' || needs.plan-dev.result == 'failure')
    runs-on: docker
    container: node:22-bookworm
    steps:
      - name: Check out the target branch's commit
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.base.sha }}'
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Take the plan report from the plan job
        run: |
          set -u
          node -e 'const fs=require("fs"),p=require("path"),z=require("zlib");const dir=process.argv[1];let b="";for(const l of fs.readFileSync(0,"utf8").split("\n")){if(!l.trim())continue;let s="";try{s=JSON.parse(l)}catch{}if(typeof s==="string")b+=s}if(!b){console.log("chant: the plan-dev job handed on no report");process.exit(0)}let files;try{files=JSON.parse(z.gunzipSync(Buffer.from(b,"base64"),{maxOutputLength:268435456}).toString("utf8"))}catch(e){console.log("chant: the report the plan-dev job handed on does not read: "+e.message);process.exit(0)}if(!files||typeof files!=="object"||Array.isArray(files)){console.log("chant: the report the plan-dev job handed on is not a set of files");process.exit(0)}let n=0;for(const [k,v] of Object.entries(files)){const parts=k.split("/");if(typeof v!=="string"||k.length>1024||parts.some((x)=>!x||x==="."||x===".."||/[\\\x00-\x1f]/.test(x))){console.log("chant: left out "+JSON.stringify(k));continue}try{const f=p.join(dir,...parts);fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,Buffer.from(v,"base64"));n++}catch(e){console.log("chant: could not write "+JSON.stringify(k)+": "+e.message)}}console.log("chant: took "+n+" report files from the plan-dev job")' .chant/pr <<'END_OF_REPORT'
          ${{ toJSON(needs.plan-dev.outputs.report_0) }}
          ${{ toJSON(needs.plan-dev.outputs.report_1) }}
          ${{ toJSON(needs.plan-dev.outputs.report_2) }}
          ${{ toJSON(needs.plan-dev.outputs.report_3) }}
          END_OF_REPORT
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: chant-pr-plan-dev
          path: .chant/pr
          if-no-files-found: ignore
      - name: Post the plan note and yodel/plan/dev
        if: always()
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          HEAD_SHA: '${{ github.sha }}'
          PLAN_RESULT: '${{ needs.plan-dev.result }}'
          GITHUB_TOKEN: '${{ github.token }}'
          CHANT_PLAN_NOTE_WORDS: '{"productMarker":"yodel:plan","subjectParts":{"applied":{"added":"{items} applied","gone":"{items} no longer applied","changed":"{items} recorded with another checksum"},"pending":{"added":"{items} now pending","gone":"{items} no longer pending","changed":"{items} edited"},"done":{"added":"statements of {items} done","gone":"{items} started over","changed":"more of {items} done"},"order":{"changed":"the pending order changed"},"live":{"changed":"the live schema changed"},"history":{"changed":"the history table changed"},"topology":{"changed":"the topology changed"},"environment":{"changed":"the environment changed"}}}'
          CHANT_PLAN_WATCHES: '[{"op":"watch-dev","cron":"17 * * * *","targets":["dev"]},{"op":"watch-prod","cron":"47 * * * *","targets":["prod"]}]'
        run: yodel chant components pr-post --pr "$PR_NUMBER" --head "$HEAD_SHA" --env yodel-pr --output .chant/pr --forge forgejo --member dev --result "$PLAN_RESULT"
