# Rendered by yodel ci from chant.config.ts, yodel.config.ts and ops/.
# Edit those and render again; yodel ci --check says when this file is stale.
# The push job reads YODEL_PUSH_TOKEN: a project access token with write_repository and api,
# as a protected, masked CI/CD variable (docs/workflows.md, /yodel rebase).
# chant Ops — one job per Op under stage "ops", each
# selected by its own rules:. A merge_request_event or push job needs no
# setup; its rule fires on the event itself.
#
#   yodel-rebase-check: merge_request_event onto any branch, finding-mode report
#   yodel-rebase-check-commit: after the check exits 2 on a merge request, runs yodel rebase --env dev --env prod and pushes its change
#     yodel-rebase-check-commit-push pushes with YODEL_PUSH_TOKEN: scope it to environment yodel-rebase-check-commit-push, protected and masked
#     the change may touch migrations/; at most 3 commits per merge request, counted on the ledger

stages:
  - ops

yodel-rebase-check:
  stage: ops
  image: node:22-bookworm
  resource_group: yodel-rebase-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node -e 'const m = Number(process.versions.node.split(".")[0]); if (m < 22) { console.error("the sql lexicon needs Node 22 or newer; this image has " + process.versions.node); process.exit(1); }'
    - '{ [ -d node_modules/@intentius/chant-lexicon-sql ] || npm ci; } && export PATH="$PWD/node_modules/.bin:$PATH" && if [ -n "${GITHUB_PATH:-}" ]; then echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"; fi'
    - mkdir -p .chant/commit
    - set +e; yodel lint --commit-trigger rebase; code=$?; set -e
    - if [ "$code" -eq 2 ]; then echo "CHANT_COMMIT_FINDING=1" > .chant/commit/finding.env; else echo "CHANT_COMMIT_FINDING=0" > .chant/commit/finding.env; fi
    - exit "$code"
  artifacts:
    when: always
    paths:
      - .chant/commit/finding.env
    reports:
      dotenv: .chant/commit/finding.env
    expire_in: '7 days'

yodel-rebase-check-commit:
  stage: ops
  image: node:22-bookworm
  resource_group: yodel-rebase-check-commit
  timeout: '25 minutes'
  variables:
    CHANT_COMMIT_NAME: yodel-rebase-check
    CHANT_COMMIT_ON: check
    CHANT_COMMIT_COMMAND: '["yodel","rebase","--env","dev","--env","prod"]'
    CHANT_COMMIT_ALLOWED: '["migrations/"]'
    CHANT_COMMIT_FINDINGS: '2'
    CHANT_COMMIT_MAX_RUNS: '3'
    CHANT_COMMIT_TIMEOUT: '10'
    CHANT_COMMIT_ENV: local
    CHANT_COMMIT_MERGE_BASE: '1'
    CHANT_COMMIT_COMMAND_ENV: '["DEV_CLICKHOUSE_URL","DEV_CLICKHOUSE_READER_USER","DEV_CLICKHOUSE_READER_PASSWORD","PROD_CLICKHOUSE_URL","PROD_CLICKHOUSE_READER_USER","PROD_CLICKHOUSE_READER_PASSWORD"]'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  needs:
    - job: yodel-rebase-check
      artifacts: true
  script:
    - if [ "${CHANT_COMMIT_FINDING:-0}" != "1" ]; then echo "the check found nothing, so yodel-rebase-check does not run"; exit 0; fi
    - |
      case "$CI_MERGE_REQUEST_IID" in ''|*[!0-9]*) echo "no pull request number" >&2; exit 1 ;; esac
      git -c protocol.version=2 fetch -q --no-tags origin "+refs/merge-requests/$CI_MERGE_REQUEST_IID/head:refs/chant/commit-head"
    - git fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
    - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
    - node -e 'const m = Number(process.versions.node.split(".")[0]); if (m < 22) { console.error("the sql lexicon needs Node 22 or newer; this image has " + process.versions.node); process.exit(1); }'
    - '{ [ -d node_modules/@intentius/chant-lexicon-sql ] || npm ci; } && export PATH="$PWD/node_modules/.bin:$PATH" && if [ -n "${GITHUB_PATH:-}" ]; then echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"; fi'
    - unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
    - yodel chant commit prepare --forge gitlab --output .chant/commit
    - yodel chant commit run --forge gitlab --output .chant/commit
  artifacts:
    when: always
    paths:
      - .chant/commit
    expire_in: '7 days'

yodel-rebase-check-commit-push:
  stage: ops
  image: node:22-bookworm
  resource_group: yodel-rebase-check-commit-push
  environment:
    name: yodel-rebase-check-commit-push
    action: access
  variables:
    CHANT_COMMIT_NAME: yodel-rebase-check
    CHANT_COMMIT_ON: check
    CHANT_COMMIT_COMMAND: '["yodel","rebase","--env","dev","--env","prod"]'
    CHANT_COMMIT_ALLOWED: '["migrations/"]'
    CHANT_COMMIT_FINDINGS: '2'
    CHANT_COMMIT_MAX_RUNS: '3'
    CHANT_COMMIT_TIMEOUT: '10'
    CHANT_COMMIT_ENV: local
    CHANT_COMMIT_MERGE_BASE: '1'
    CHANT_COMMIT_COMMAND_ENV: '["DEV_CLICKHOUSE_URL","DEV_CLICKHOUSE_READER_USER","DEV_CLICKHOUSE_READER_PASSWORD","PROD_CLICKHOUSE_URL","PROD_CLICKHOUSE_READER_USER","PROD_CLICKHOUSE_READER_PASSWORD"]'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  needs:
    - job: yodel-rebase-check-commit
      artifacts: true
  script:
    - if [ ! -f .chant/commit/decision.json ]; then echo "yodel-rebase-check did not run"; exit 0; fi
    - |
      case "$CI_MERGE_REQUEST_IID" in ''|*[!0-9]*) echo "no pull request number" >&2; exit 1 ;; esac
      git -c protocol.version=2 fetch -q --no-tags origin "+refs/merge-requests/$CI_MERGE_REQUEST_IID/head:refs/chant/commit-head"
    - git fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
    - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
    - node -e 'const m = Number(process.versions.node.split(".")[0]); if (m < 22) { console.error("the sql lexicon needs Node 22 or newer; this image has " + process.versions.node); process.exit(1); }'
    - '{ [ -d node_modules/@intentius/chant-lexicon-sql ] || npm ci; } && export PATH="$PWD/node_modules/.bin:$PATH" && if [ -n "${GITHUB_PATH:-}" ]; then echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"; fi'
    - export CHANT_GITLAB_TOKEN="$YODEL_PUSH_TOKEN"
    - chant_auth="$(printf 'oauth2:%s' "$YODEL_PUSH_TOKEN" | base64 | tr -d '\n')"
    - 'export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $chant_auth"'
    - unset chant_auth
    - yodel chant commit land --forge gitlab --output .chant/commit
